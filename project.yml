name: AltLoad
options:
  bundleIdPrefix: com.mirazbakis
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    # Shown after the version in About ("1.2.0 beta 1"). Empty for a final release.
    ALTLOAD_PRERELEASE: "beta 1"
    TARGETED_DEVICE_FAMILY: "1,2"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  AltLoad:
    type: application
    platform: iOS
    sources:
      - path: ios/App
        excludes:
          - Resources/AltLoad.icon
      - path: ios/App/Resources/AltLoad.icon
        buildPhase: resources
      - path: ios/Shared
    dependencies:
      - framework: AltLoadFFI.xcframework
        embed: false
      - target: AltLoadWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirazbakis.altload
        INFOPLIST_FILE: ios/App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AltLoad
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO

  # Live Activity that shows the pairing code in the Dynamic Island.
  AltLoadWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Widgets
        excludes:
          - Info.plist
      - path: ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirazbakis.altload.widgets
        INFOPLIST_FILE: ios/Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
