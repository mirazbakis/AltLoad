name: Sign IPAs & Deploy OTA

# Downloads the latest NON-beta AltLoad release IPA, re-signs it once per cert
# pack under signing/certs/<N>/ (rewriting the bundle id to com.mirazbakis.altload<N>),
# writes a manifest.plist per slot, and publishes the AltLoad OTA install page to
# GitHub Pages — one "Install" button per signed copy (sideinstaller.net style).
#
# Each cert pack folder signing/certs/<N>/ holds:
#   <N>.p12               the signing certificate + private key
#   <N>.mobileprovision   the ad-hoc provisioning profile (its registered UDIDs)
#
# Ad-hoc signing: a device can only install a slot if its UDID is in that slot's
# profile. The default .p12 password is "WSF" (override with the P12_PASSWORD secret).
#
# Pages source must be set to "GitHub Actions":
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Override IPA URL (default: latest non-beta release)"
        type: string
        required: false
  push:
    paths:
      - "signing/**"
      - "site/**"
      - ".github/workflows/sign-ota.yml"
  # A new AltLoad release goes out on the page straight away.
  release:
    types: [published]
  # Re-sign and rewrite every manifest.plist and installs/index.json once a week,
  # so the page never points at stale builds.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sign-and-deploy:
    runs-on: macos-14
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download latest non-beta AltLoad IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          : "${IPA_URL:=https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AltLoad.ipa}"
          echo ">> Fetching $IPA_URL"
          curl -fL --retry 3 -o "$RUNNER_TEMP/AltLoad.ipa" "$IPA_URL"
          ls -lh "$RUNNER_TEMP/AltLoad.ipa"

      # Apple's codesign refuses revoked or expired identities, so those packs are
      # signed with rcodesign, which reads the .p12 directly. Pinned and checked
      # against the release's published SHA-256.
      - name: Install rcodesign
        run: |
          set -euo pipefail
          V=0.29.0
          F="apple-codesign-$V-macos-universal.tar.gz"
          SHA=d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$F" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/$V/$F"
          echo "$SHA  $RUNNER_TEMP/$F" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/rcodesign"
          tar -xzf "$RUNNER_TEMP/$F" -C "$RUNNER_TEMP/rcodesign"
          BIN="$(find "$RUNNER_TEMP/rcodesign" -type f -name rcodesign | head -n1)"
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Sign every cert pack & build manifests
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # No -e here: a pack that fails is skipped so the others (and the site)
          # still go out. (Actions starts bash with -e, so it's switched off.)
          set +e
          set -uo pipefail
          chmod +x signing/scripts/*.sh
          mkdir -p _site/installs
          SRC_IPA="$RUNNER_TEMP/AltLoad.ipa"
          ICON="site/AltLoad.png"

          echo "| Cert pack | Bundle id | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          SIGNED=0; FAILED=0
          for dir in signing/certs/*/; do
            n="$(basename "$dir")"
            slug="altload$n"
            LOG="$RUNNER_TEMP/sign-$n.log"

            echo "::group::Signing $slug"
            (
              set -euo pipefail
              signing/scripts/sign-pack.sh "$dir" "$SRC_IPA" "com.mirazbakis.$slug" "$RUNNER_TEMP/$slug.ipa"
              signing/scripts/build-manifest.sh "$RUNNER_TEMP/$slug.ipa" "$BASE_URL" "_site" "$slug" "$ICON"
            ) 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "$rc" -eq 0 ]; then
              SIGNED=$((SIGNED+1))
              st="$(grep '^STATUS=' "$LOG" | tail -n1 | cut -d= -f2)"
              echo "STATUS=${st:-valid}" >> "_site/installs/$slug/meta.txt"
              echo "| $n | com.mirazbakis.$slug | signed (${st:-valid}) |" >> "$GITHUB_STEP_SUMMARY"
            else
              FAILED=$((FAILED+1))
              rm -rf "_site/installs/$slug"
              # Annotations are readable without signing in, unlike step logs.
              msg="$(grep -v '^>>' "$LOG" | grep -v '^ *$' | tail -n 4 | tr '\n' ' ' | cut -c1-500)"
              echo "::warning title=Cert pack $n skipped::$msg"
              echo "| $n | com.mirazbakis.$slug | failed: ${msg//|/ } |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "Signed $SIGNED pack(s), $FAILED failed."
          if [ "$SIGNED" -eq 0 ]; then
            echo "::warning::No cert pack could be signed. Deploying the site without install buttons."
          fi

      - name: Build OTA site
        run: |
          set -euo pipefail
          signing/scripts/build-site.sh "site" "_site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Install link
        run: |
          echo "### AltLoad OTA page ready :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open on the device in **Safari**: ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
