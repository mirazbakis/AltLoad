name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Export DEVELOPER_DIR
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          brew install xcodegen

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust FFI xcframework
        run: bash ./build-rust.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -project AltLoad.xcodeproj \
            -scheme AltLoad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release-iphoneos/AltLoad.app"
          rm -rf build/Payload AltLoad.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          find build/Payload -name '.DS_Store' -delete
          (cd build && zip -qr ../AltLoad.ipa Payload)
          ls -lh AltLoad.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: AltLoad-unsigned
          path: AltLoad.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: AltLoad.ipa

      # Keeps a public "Nightly build" release pointing at the newest main build,
      # so anyone can download the IPA without a GitHub account.
      - name: Publish nightly build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f nightly
          git push -f origin refs/tags/nightly
          NOTES="Latest unsigned build of \`main\` (commit ${GITHUB_SHA::7}). Updated automatically on every push. Sign it with your own tool before installing. For stable builds, use the versioned releases."
          # Recreate the release each time so its date shows when this build was made.
          gh release delete nightly --yes >/dev/null 2>&1 || true
          gh release create nightly AltLoad.ipa --prerelease --title "Nightly build" --notes "$NOTES"
