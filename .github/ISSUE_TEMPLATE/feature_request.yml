name: Feature request
description: Suggest something new for AltLoad or altpair.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like?
      description: Describe the feature and what you'd use it for.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do this today?
      description: Any workaround you use now, if there is one.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, links or examples.
