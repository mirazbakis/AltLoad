# Dependabot only updates the GitHub Actions used by the workflows.
# The app itself (Rust core in core/, iOS code in ios/) is intentionally not watched.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
